<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Flowboard — a customizable agile Kanban board with epics, stories, tasks, bugs and t-shirt sizing. Runs entirely in your browser.">
<meta name="theme-color" content="#f5f6fb" id="themeColor">
<meta name="apple-mobile-web-app-title" content="Flowboard">
<title>Flowboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236c5ce7'/%3E%3Crect x='7' y='8' width='5' height='16' rx='1.5' fill='white'/%3E%3Crect x='14' y='8' width='5' height='10' rx='1.5' fill='white' fill-opacity='.75'/%3E%3Crect x='21' y='8' width='5' height='13' rx='1.5' fill='white' fill-opacity='.55'/%3E%3C/svg%3E">
<style>
  /* System fonts on purpose: the board stays offline and looks the same everywhere. */
  :root {
    --bg: #f5f6fb;
    --surface: #ffffff;
    --surface-2: #eceef6;
    --surface-3: #e3e5f0;
    --border: #e1e3ef;
    --border-strong: #cfd2e3;
    --fg: #1b1c2b;
    --muted: #6a6c84;
    --faint: #9a9cb4;
    --accent: #6c5ce7;
    --accent-ink: #ffffff;
    --shadow: 0 1px 2px rgba(22,23,43,.06), 0 6px 20px rgba(22,23,43,.08);
    --shadow-lift: 0 6px 14px rgba(22,23,43,.14), 0 18px 40px rgba(22,23,43,.18);
    --radius: 12px;
    --p-critical: #e2445c;
    --p-high: #fdab3d;
    --p-medium: #579bfc;
    --p-low: #00c875;
    --font-display: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-body: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12131d;
      --surface: #1e2030;
      --surface-2: #191b28;
      --surface-3: #242637;
      --border: #2c2f42;
      --border-strong: #3a3d54;
      --fg: #ecedf5;
      --muted: #9b9db6;
      --faint: #6d6f88;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.4);
      --shadow-lift: 0 6px 14px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12131d;
    --surface: #1e2030;
    --surface-2: #191b28;
    --surface-3: #242637;
    --border: #2c2f42;
    --border-strong: #3a3d54;
    --fg: #ecedf5;
    --muted: #9b9db6;
    --faint: #6d6f88;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.4);
    --shadow-lift: 0 6px 14px rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.45;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  [hidden] { display: none !important; }
  img, svg { -webkit-user-drag: none; }
  button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  input, textarea, select { font-family: inherit; font-size: inherit; color: var(--fg); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  #app { display: flex; flex-direction: column; height: 100%; }

  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 20; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
  .brand-dot {
    width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--accent), #b07cff);
    box-shadow: 0 2px 8px rgba(108, 92, 231, .35);
  }
  .board-title {
    font-family: var(--font-display); font-weight: 700; font-size: 20px;
    letter-spacing: -.01em; color: var(--fg);
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    padding: 4px 8px; max-width: 46vw; min-width: 0; width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .stats { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spacer { flex: 1 1 auto; }
  .search {
    display: flex; align-items: center; gap: 7px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 6px 8px 6px 11px; min-width: 0;
    flex: 1 1 180px; max-width: 320px;
  }
  .search svg { width: 15px; height: 15px; color: var(--faint); flex: 0 0 auto; }
  .search input { border: none; background: none; outline: none; width: 100%; min-width: 0; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search input::placeholder { color: var(--faint); }
  .search-clear { width: 28px; height: 28px; border-radius: 7px; color: var(--muted); font-size: 18px; line-height: 1; flex: 0 0 auto; }
  .actions { display: flex; align-items: center; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 13px; border-radius: 9px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--border);
    white-space: nowrap; min-height: 36px;
  }
  .btn svg { width: 15px; height: 15px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn-icon { padding: 8px; width: 36px; justify-content: center; }
  .btn:active { transform: translateY(1px); }

  .filter-bar {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding-right: max(12px, env(safe-area-inset-right, 0px));
  }
  .filters {
    display: flex; gap: 6px; align-items: center; overflow-x: auto; flex: 1 1 auto; min-width: 0;
    padding: 8px 4px 8px max(16px, env(safe-area-inset-left, 0px));
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex: 0 0 auto; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--muted); border-radius: 999px; padding: 6px 12px;
    font-weight: 700; font-size: 12.5px; min-height: 32px;
  }
  .filter-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .filter-clear { color: var(--fg); flex: 0 0 auto; background: var(--surface-2); }

  .empty-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 14px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
    padding: 12px 14px; border-radius: 12px;
    background: var(--surface); border: 1px dashed var(--border-strong);
    color: var(--muted); font-weight: 600;
  }

  .board-scroll { flex: 1 1 auto; overflow: auto; min-height: 0; -webkit-overflow-scrolling: touch; }
  .board {
    display: flex; align-items: flex-start; gap: 14px; height: 100%; min-height: 100%;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-width: min-content;
  }

  .col {
    flex: 0 0 min(300px, 86vw); width: min(300px, 86vw); max-height: 100%;
    display: flex; flex-direction: column;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .col.lifting { box-shadow: var(--shadow-lift); position: relative; z-index: 2; }
  .col.col-drop { box-shadow: inset 0 0 0 2px var(--accent); }
  .col-head {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 6px 8px 10px; border-bottom: 1px solid var(--border);
  }
  .col-swatch { width: 6px; align-self: stretch; border-radius: 6px; flex: 0 0 auto; background: var(--col-color, var(--accent)); min-height: 22px; }
  .col-name {
    font-family: var(--font-display); font-weight: 600; font-size: 15px;
    color: var(--col-color, var(--fg)); background: transparent; border: 1px solid transparent;
    border-radius: 7px; padding: 4px 6px; min-width: 0; flex: 1 1 auto; width: 100%;
  }
  .col-name:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .col-count {
    font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12px;
    color: var(--muted); background: var(--surface-3); border-radius: 20px;
    padding: 2px 8px; flex: 0 0 auto;
  }
  .col-grip, .col-menu-btn { color: var(--muted); padding: 6px; border-radius: 8px; flex: 0 0 auto; touch-action: none; }
  .col-grip svg, .col-menu-btn svg { width: 16px; height: 16px; display: block; }
  .cards {
    flex: 1 1 auto; overflow-y: auto; min-height: 72px;
    padding: 10px; display: flex; flex-direction: column; gap: 9px;
    -webkit-overflow-scrolling: touch;
  }
  .cards.drop-active { background: rgba(108, 92, 231, .08); background: color-mix(in oklab, var(--accent) 8%, transparent); }
  .placeholder {
    border: 1.5px dashed var(--accent); border-radius: 10px; flex: 0 0 auto;
    background: rgba(108, 92, 231, .08); background: color-mix(in oklab, var(--accent) 10%, transparent);
  }

  .card {
    position: relative;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 34px 11px 12px; box-shadow: var(--shadow);
    cursor: pointer; display: flex; flex-direction: column; gap: 8px;
    touch-action: manipulation;
  }
  .card.dragging {
    position: fixed; z-index: 80; margin: 0; pointer-events: none; opacity: .96;
    box-shadow: var(--shadow-lift); cursor: grabbing;
  }
  .card-title { font-weight: 600; font-size: 14px; letter-spacing: -.005em; word-break: break-word; }
  .card-title.is-untitled { color: var(--faint); }
  .card-labels { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font-size: 11px; font-weight: 700; letter-spacing: .02em;
    color: #fff; border-radius: 6px; padding: 3px 8px; white-space: nowrap;
  }
  .type-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; letter-spacing: .02em;
    border: 1.3px solid currentColor; border-radius: 6px; padding: 2px 7px 2px 5px; background: transparent;
  }
  .epic-chip, .rollup {
    display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; max-width: 100%;
    font-size: 11px; font-weight: 700; color: #a55eea;
    background: rgba(165, 94, 234, .15); border-radius: 6px; padding: 3px 8px;
    text-align: left;
  }
  .epic-chip span, .rollup span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rollup { color: var(--accent); background: rgba(108, 92, 231, .12); }
  .rollup.warn { color: var(--p-critical); background: rgba(226, 68, 92, .14); }
  .size-badge {
    display: inline-grid; place-items: center; min-width: 26px; height: 20px; padding: 0 6px;
    font-size: 11px; font-weight: 800; letter-spacing: .02em; color: #fff;
    border-radius: 6px; background: var(--sz, var(--muted)); font-variant-numeric: tabular-nums;
  }
  .seg .type-opt { display: inline-flex; align-items: center; gap: 5px; }
  .card-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill {
    font-size: 11px; font-weight: 700; border-radius: 20px; padding: 3px 9px;
    color: #fff; text-transform: uppercase; letter-spacing: .03em;
  }
  .due {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; font-weight: 600; color: var(--muted);
    background: var(--surface-2); border-radius: 6px; padding: 3px 7px;
    font-variant-numeric: tabular-nums;
  }
  .due svg { width: 12px; height: 12px; }
  .due.today { color: #9a5b00; background: #fff4df; }
  .due.overdue { color: #fff; background: var(--p-critical); }
  .avatar {
    margin-left: auto; width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
    display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700;
  }
  .drag-handle {
    position: absolute; top: 6px; right: 4px; width: 28px; height: 28px;
    border-radius: 8px; color: var(--faint); display: grid; place-items: center;
    cursor: grab; touch-action: none;
  }
  .drag-handle svg { width: 14px; height: 14px; }

  .add-item {
    display: flex; align-items: center; gap: 7px; width: 100%;
    padding: 9px 11px; color: var(--muted); font-weight: 600;
    border-radius: 9px; border: 1px dashed transparent; margin-top: 2px; min-height: 40px;
  }
  .add-item svg { width: 15px; height: 15px; }
  .add-input {
    width: 100%; padding: 10px 11px; border-radius: 9px;
    border: 1px solid var(--accent); background: var(--surface); outline: none;
  }
  .col-foot { padding: 0 10px 10px; }

  .add-col {
    flex: 0 0 min(272px, 80vw); width: min(272px, 80vw);
    display: flex; align-items: center; gap: 8px; justify-content: center;
    padding: 13px; border-radius: var(--radius); font-weight: 600; color: var(--muted);
    background: rgba(236, 238, 246, .7); border: 1px dashed var(--border-strong); min-height: 52px;
  }

  .menu {
    position: fixed; z-index: 60; min-width: 196px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 11px; box-shadow: var(--shadow-lift); padding: 6px;
  }
  .menu button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 10px; border-radius: 8px; font-weight: 500;
  }
  .menu button.danger { color: var(--p-critical); }
  .menu button svg { width: 15px; height: 15px; }
  .menu .sep { height: 1px; background: var(--border); margin: 5px 2px; }
  .swatch-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 8px 6px; }
  .swatch { width: 22px; height: 22px; border-radius: 7px; border: 2px solid transparent; }
  .swatch[aria-pressed="true"] { border-color: var(--fg); }

  .scrim { position: fixed; inset: 0; background: rgba(12,13,22,.42); z-index: 40; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
    width: min(440px, 100vw); background: var(--surface);
    border-left: 1px solid var(--border); box-shadow: var(--shadow-lift);
    display: flex; flex-direction: column;
    padding-right: env(safe-area-inset-right, 0px);
  }
  .panel-head {
    display: flex; align-items: center; gap: 10px; padding: 16px 18px;
    border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .panel-head h2 { font-family: var(--font-display); font-size: 17px; margin: 0; font-weight: 700; flex: 1 1 auto; }
  .panel-body { flex: 1 1 auto; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 18px; -webkit-overflow-scrolling: touch; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field > label { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .field input[type="text"], .field input[type="date"], .field textarea, .field select {
    width: 100%; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface-2); outline: none;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); background: var(--surface); }
  .field textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button {
    padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 12.5px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); min-height: 34px;
  }
  .seg button[aria-pressed="true"] { color: #fff; border-color: transparent; }
  .steps { display: flex; flex-direction: column; gap: 8px; }
  .step { display: flex; align-items: center; gap: 8px; }
  .step-num { flex: 0 0 auto; width: 1.8em; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .step input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); flex: 0 0 auto; }
  .step input[type="text"] {
    flex: 1 1 auto; min-width: 0; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); outline: none;
  }
  .step input[type="text"]:focus { border-color: var(--accent); background: var(--surface); }
  .step.is-done input[type="text"] { text-decoration: line-through; color: var(--muted); }
  .steps .btn { align-self: flex-start; }
  .label-picker { display: flex; flex-wrap: wrap; gap: 7px; }
  .label-toggle {
    font-size: 12px; font-weight: 700; border-radius: 7px; padding: 5px 10px;
    border: 1.5px solid; background: transparent; min-height: 32px;
  }
  .label-toggle[aria-pressed="true"] { color: #fff; }
  .panel-foot {
    flex: 0 0 auto; padding: 14px 18px max(14px, env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border); display: flex; gap: 10px;
  }
  .panel-foot .btn { flex: 1 1 auto; justify-content: center; }
  .due-editor { display: flex; flex-direction: column; gap: 8px; }

  .cust-section { display: flex; flex-direction: column; gap: 10px; }
  .cust-section h3 { font-family: var(--font-display); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0; }
  .label-row { display: flex; align-items: center; gap: 8px; }
  .label-row input[type="text"] { flex: 1 1 auto; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); outline: none; min-width: 0; }
  .label-row input:focus { border-color: var(--accent); }
  .mini-swatch { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); flex: 0 0 auto; }
  .icon-btn { padding: 7px; border-radius: 8px; color: var(--muted); min-width: 36px; min-height: 36px; }
  .icon-btn svg { width: 16px; height: 16px; display: block; }
  .data-area { width: 100%; min-height: 96px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; padding: 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface-2); color: var(--fg); resize: vertical; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 0; }
  .panel.dash { width: min(680px, 100vw); }
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; }
  .dash-stat {
    text-align: left; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; min-height: 76px; width: 100%;
  }
  .dash-stat strong {
    display: block; font-family: var(--font-display); font-size: 26px;
    letter-spacing: -.03em; line-height: 1.1;
  }
  .dash-stat span { color: var(--muted); font-size: 12px; font-weight: 700; }
  .dash-stat[data-hot="true"] strong { color: var(--p-critical); }
  .dash-rows { display: flex; flex-direction: column; gap: 8px; }
  .dash-line {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center;
    width: 100%; text-align: left; padding: 2px 0; background: none; border: 0; border-radius: 8px;
  }
  .dash-line b { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-line em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; font-size: 12px; }
  .dash-track { grid-column: 1 / -1; height: 7px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
  .dash-fill { display: block; height: 100%; border-radius: 99px; width: 0; }
  details.advanced > summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: 13px; }
  .data-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .file-btn input { display: none; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 80;
    display: flex; align-items: center; gap: 14px;
    background: var(--fg); color: var(--bg);
    padding: 11px 16px; border-radius: 11px; box-shadow: var(--shadow-lift);
    font-weight: 600; max-width: min(440px, calc(100vw - 24px));
  }
  .toast button { color: #c4b8ff; font-weight: 800; }
  .remote-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin: 8px 16px 0; padding: 10px 12px; border-radius: 10px;
    background: color-mix(in oklab, var(--accent) 12%, var(--surface));
    border: 1px solid var(--border); font-weight: 600;
  }
  .remote-banner[hidden] { display: none; }
  .remote-banner .actions { display: flex; gap: 8px; }
  .activity-item { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .activity-item strong { font-size: 14px; }
  .activity-item span { color: var(--muted); font-size: 12px; }
  .empty-hint { color: var(--faint); font-size: 12.5px; text-align: center; padding: 14px 6px; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
  noscript p { padding: 24px; }

  @media (hover: hover) and (pointer: fine) {
    .board-title:hover, .col-name:hover { background: var(--surface-2); }
    .btn:hover, .add-item:hover, .menu button:hover, .search-clear:hover, .col-grip:hover, .col-menu-btn:hover, .drag-handle:hover { background: var(--surface-3); color: var(--fg); }
    .step input[type="text"]:hover { border-color: var(--border-strong); }
    button.dash-stat:hover, button.dash-line:hover { background: var(--surface-3); }
    .btn-primary:hover { background: #5b4bd6; color: #fff; }
    .card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-lift); }
    .add-col:hover { color: var(--fg); background: var(--surface-2); }
    .icon-btn:hover { background: var(--surface-2); color: var(--p-critical); }
    .filter-chip:hover { border-color: var(--border-strong); color: var(--fg); }
  }
  :root[data-theme="dark"] .due.today { color: #fdab3d; background: rgba(253, 171, 61, .16); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .due.today { color: #fdab3d; background: rgba(253, 171, 61, .16); }
  }
  @media (pointer: coarse) {
    .btn, .col-menu-btn, .col-grip { min-height: 44px; }
    .col-menu-btn, .col-grip, .drag-handle { min-width: 44px; }
    .drag-handle { height: 44px; width: 44px; top: 2px; right: 2px; }
    .card { padding-right: 48px; }
    .board-scroll { scroll-snap-type: x mandatory; }
    .col, .add-col { scroll-snap-align: start; }
  }
  @media (max-width: 700px) {
    .spacer, .stats { display: none; }
    .search { order: 5; flex: 1 1 100%; max-width: none; }
    .actions { margin-left: auto; }
    .board-title { max-width: 52vw; font-size: 18px; }
    .btn-label { display: none; }
    .col, .add-col { flex-basis: calc(100vw - 92px); width: calc(100vw - 92px); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .card.dragging { transform: rotate(1.25deg); }

  }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, 8px); } }
</style>

<body>
<noscript><p>Flowboard needs JavaScript.</p></noscript>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-dot" aria-hidden="true"></div>

    <div class="search">

      <input id="search" type="search" placeholder="Search cards" aria-label="Search cards" title="Search cards (press /)" autocomplete="off" enterkeyhint="search" />
      <button type="button" class="search-clear" id="searchClear" aria-label="Clear search" hidden>&times;</button>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-icon" id="themeBtn" title="Theme" aria-label="Switch theme"></button>
      <button type="button" class="btn" id="changesBtn" aria-label="Changes from other people"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg><span class="btn-label">Changes</span></button>
      <button type="button" class="btn" id="summaryBtn" aria-label="Summary dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="M8 16v-5M12 16V8M16 16v-3"/></svg><span class="btn-label">Summary</span></button>
      <button type="button" class="btn" id="customizeBtn" aria-label="Customize board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 6.6 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1-2.7H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 6.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg><span class="btn-label">Customize</span></button>
      <button type="button" class="btn btn-primary" id="addColBtn" aria-label="Add group"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="btn-label">Group</span></button>
    </div>
  </header>
  <div id="remoteBanner" class="remote-banner" hidden></div>
  <div class="filter-bar" id="filters">
    <div class="filters" role="toolbar" aria-label="Filter cards">
      <button type="button" class="filter-chip" data-filter="type" data-value="" aria-pressed="true">All</button>
      <button type="button" class="filter-chip" data-filter="type" data-value="epic">Epic</button>
      <button type="button" class="filter-chip" data-filter="type" data-value="story">Story</button>
      <button type="button" class="filter-chip" data-filter="type" data-value="task">Task</button>
      <button type="button" class="filter-chip" data-filter="type" data-value="bug">Bug</button>
      <button type="button" class="filter-chip" data-filter="overdue" aria-pressed="false">Overdue</button>

  </div>
  <div class="board-scroll" id="boardScroll">
    <div id="emptyBanner" class="empty-banner" hidden></div>
    <div class="board" id="board"></div>
  </div>
</div>
<div id="live" class="sr" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var LS_KEY = "flowboard.v1";
  var LS_REV = "flowboard.rev";
  var LS_PENDING = "flowboard.pending";
  var LS_THEME = "flowboard.theme";

  var COLORS = [
    { name: "Indigo", hex: "#6c5ce7" }, { name: "Violet", hex: "#a55eea" },
    { name: "Sky", hex: "#579bfc" }, { name: "Teal", hex: "#2bccbb" },
    { name: "Green", hex: "#00c875" }, { name: "Lime", hex: "#9cd326" },
    { name: "Amber", hex: "#fdab3d" }, { name: "Orange", hex: "#ff7b54" },
    { name: "Rose", hex: "#e2445c" }, { name: "Pink", hex: "#ff5ac4" },
    { name: "Slate", hex: "#7e8299" }, { name: "Navy", hex: "#394778" }
  ];
  var PRIORITIES = [
    { id: "none", name: "None", color: "" },
    { id: "low", name: "Low", color: "var(--p-low)" },
    { id: "medium", name: "Medium", color: "var(--p-medium)" },
    { id: "high", name: "High", color: "var(--p-high)" },
    { id: "critical", name: "Critical", color: "var(--p-critical)" }
  ];
  var TYPES = [
    { id: "epic", name: "Epic", color: "#a55eea" },
    { id: "story", name: "Story", color: "#00c875" },
    { id: "task", name: "Task", color: "#579bfc" },
    { id: "bug", name: "Bug", color: "#e2445c" }
  ];
  var TYPE_ICONS = {
    epic: '<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>',
    story: '<path d="M4 4h16v16l-8-5-8 5Z"/>',
    task: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
    bug: '<rect x="7" y="8" width="10" height="11" rx="5"/><path d="M12 3v3M5 9l2.5 1.5M19 9l-2.5 1.5M4 15h3M17 15h3M6 20l2-2M18 20l-2-2"/>'
  };
  var SIZES = ["XS", "S", "M", "L", "XL", "XXL"];
  var SIZE_COLORS = { XS: "#00c875", S: "#9cd326", M: "#579bfc", L: "#fdab3d", XL: "#ff7b54", XXL: "#e2445c" };
  var POINTS = { XS: 1, S: 2, M: 3, L: 5, XL: 8, XXL: 13 };
  var AVATAR_COLORS = ["#6c5ce7", "#579bfc", "#00c875", "#fdab3d", "#e2445c", "#a55eea", "#2bccbb", "#ff7b54", "#394778"];
  var GRIP_SVG = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="6" cy="3.5" r="1.15"/><circle cx="10" cy="3.5" r="1.15"/><circle cx="6" cy="8" r="1.15"/><circle cx="10" cy="8" r="1.15"/><circle cx="6" cy="12.5" r="1.15"/><circle cx="10" cy="12.5" r="1.15"/></svg>';

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function safeColor(v, fallback) {
    return typeof v === "string" && /^#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})$/.test(v) ? v : fallback;
  }
  function isoDate(d) {
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  }
  function offsetDate(days) {
    var d = new Date();
    d.setDate(d.getDate() + days);
    return isoDate(d);
  }
  function validDate(v) {
    if (typeof v !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
    var d = new Date(v + "T00:00:00");
    return !isNaN(d.getTime()) && isoDate(d) === v;
  }
  function typeOk(id) { for (var i = 0; i < TYPES.length; i++) if (TYPES[i].id === id) return true; return false; }
  function priorityOk(id) { for (var i = 0; i < PRIORITIES.length; i++) if (PRIORITIES[i].id === id) return true; return false; }
  function typeById(id) { for (var i = 0; i < TYPES.length; i++) if (TYPES[i].id === id) return TYPES[i]; return TYPES[2]; }
  function cardPoints(card) {
    return card && POINTS[card.size] || 0;
  }
  function cleanSteps(list) {
    var steps = [];
    if (!Array.isArray(list)) return steps;
    for (var i = 0; i < list.length && steps.length < 40; i++) {
      var step = list[i];
      if (!step || typeof step !== "object") continue;
      var text = String(step.text || "").slice(0, 240);
      if (!text.trim()) continue;
      steps.push({ text: text, done: !!step.done });
    }
    return steps;
  }
  function typeIcon(id, px) {
    var t = typeById(id);
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:' + (px || 13) + 'px;height:' + (px || 13) + 'px;flex:0 0 auto" aria-hidden="true">' + (TYPE_ICONS[t.id] || TYPE_ICONS.task) + '</svg>';
  }
  function closest(node, sel) {
    var el = node && node.nodeType === 1 ? node : node && node.parentElement;
    if (!el || !el.closest) return null;
    return el.closest(sel);
  }
  function reduceMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }
  function isIOS() {
    var ua = navigator.userAgent || "";
    if (/iPad|iPhone|iPod/.test(ua)) return true;
    return navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
  }
  function button(cls) {
    var b = document.createElement("button");
    b.type = "button";
    if (cls) b.className = cls;
    return b;
  }

  function seed() {
    var L = {
      design: { id: "l_design", name: "Design", color: "#a55eea" },
      bug: { id: "l_bug", name: "Bug", color: "#e2445c" },
      feat: { id: "l_feat", name: "Feature", color: "#00c875" },
      research: { id: "l_res", name: "Research", color: "#579bfc" }
    };
    return {
      title: "Email & Contact Board",
      accent: "#6c5ce7",
      labels: [L.design, L.bug, L.feat, L.research],
      columns: [
        { id: uid(), name: "Backlog", color: "#7e8299", cards: [] },
        { id: uid(), name: "In Progress", color: "#579bfc", cards: [] },
        { id: uid(), name: "Review", color: "#fdab3d", cards: [] },
        { id: uid(), name: "Done", color: "#00c875", cards: [] }
      ]
    };
  }

  var PLACEHOLDER_TITLES = {
    "Onboarding revamp": true,
    "Audit onboarding funnel drop-off": true,
    "Dark mode polish pass": true,
    "Build drag-and-drop board view": true,
    "Fix date picker crash on Safari": true,
    "Custom label color palette": true,
    "Set up board persistence": true
  };
  function dropPlaceholder(board) {
    if (!board || board.title !== "Product Sprint") return false;
    board.title = "Email & Contact Board";
    for (var i = 0; i < board.columns.length; i++) {
      var kept = [];
      var cards = board.columns[i].cards || [];
      for (var j = 0; j < cards.length; j++) {
        if (!PLACEHOLDER_TITLES[cards[j].title]) kept.push(cards[j]);
      }
      board.columns[i].cards = kept;
    }
    return true;
  }

  function normalize(input) {
    if (!input || typeof input !== "object" || !Array.isArray(input.columns)) return null;
    var used = {};
    var idMap = {};
    function claim(raw) {
      var base = String(raw == null ? "" : raw).replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40);
      var id = base && !used[base] ? base : uid();
      while (used[id]) id = uid();
      used[id] = true;
      if (raw != null && String(raw) !== id) idMap[String(raw)] = id;
      return id;
    }
    var labels = [];
    if (Array.isArray(input.labels)) {
      for (var i = 0; i < input.labels.length; i++) {
        var l = input.labels[i];
        if (!l || typeof l !== "object") continue;
        labels.push({ id: claim(l.id), name: String(l.name || "Label").slice(0, 40) || "Label", color: safeColor(l.color, "#7e8299") });
      }
    }
    var labelIds = {};
    for (var li = 0; li < labels.length; li++) labelIds[labels[li].id] = true;
    var columns = [];
    for (var ci = 0; ci < input.columns.length; ci++) {
      var col = input.columns[ci];
      if (!col || typeof col !== "object") continue;
      var cards = [];
      var list = Array.isArray(col.cards) ? col.cards : [];
      for (var j = 0; j < list.length; j++) {
        var cd = list[j];
        if (!cd || typeof cd !== "object") continue;
        var on = [];
        if (Array.isArray(cd.labels)) {
          for (var k = 0; k < cd.labels.length; k++) {
            var mapped = idMap[String(cd.labels[k])] || String(cd.labels[k] || "").replace(/[^A-Za-z0-9_-]/g, "");
            if (labelIds[mapped]) on.push(mapped);
          }
        }
        cards.push({
          id: claim(cd.id),
          title: String(cd.title || "").slice(0, 500),
          notes: String(cd.notes || "").slice(0, 8000),
          type: typeOk(cd.type) ? cd.type : "task",
          size: SIZES.indexOf(cd.size) === -1 ? "" : cd.size,
          steps: cleanSteps(cd.steps),
          epic: typeof cd.epic === "string" ? cd.epic : "",
          priority: priorityOk(cd.priority) ? cd.priority : "none",
          assignee: String(cd.assignee || "").slice(0, 80),
          due: validDate(cd.due) ? cd.due : "",
          labels: on
        });
      }
      columns.push({
        id: claim(col.id),
        name: String(col.name || "Group").slice(0, 80) || "Group",
        color: safeColor(col.color, COLORS[ci % COLORS.length].hex),
        cards: cards
      });
    }
    var cardIds = {};
    for (var a = 0; a < columns.length; a++) {
      for (var b = 0; b < columns[a].cards.length; b++) cardIds[columns[a].cards[b].id] = columns[a].cards[b];
    }
    for (var c = 0; c < columns.length; c++) {
      for (var d = 0; d < columns[c].cards.length; d++) {
        var card = columns[c].cards[d];
        var ep = idMap[card.epic] || card.epic;
        var target = cardIds[ep];
        card.epic = target && target.type === "epic" && target.id !== card.id ? target.id : "";
        if (card.type === "epic") card.epic = "";
      }
    }
    var title = String(input.title || "Untitled board").slice(0, 120).trim() || "Untitled board";
    return { title: title, accent: safeColor(input.accent, "#6c5ce7"), labels: labels, columns: columns };
  }

  var state = null;
  var storedRaw = null;
  try { storedRaw = localStorage.getItem(LS_KEY); } catch (e) { storedRaw = null; }
  if (storedRaw) {
    try { state = normalize(JSON.parse(storedRaw)); } catch (err) { state = null; }
  }
  if (!state) state = seed();
  dropPlaceholder(state);

  var filters = { type: "", overdue: false, epic: "" };
  var query = "";
  var drag = null;
  var pressLock = false;
  var suppressTimer = 0;
  var openMenuEl = null;
  var scrim = null;
  var panel = null;
  var triggerEl = null;
  var returnCardId = null;
  var fieldSeq = 0;
  var saveTimer = 0;
  var saveWarned = false;
  var renderFrame = 0;
  var serverRevision = 0;
  var knownRevision = 0;
  var shared = false;
  var applyingRemote = false;
  var dirty = false;
  var pendingLocal = false;
  try { pendingLocal = localStorage.getItem(LS_PENDING) === "1"; } catch (ePending) { pendingLocal = false; }
  var pushTimer = 0;
  var pullTimer = 0;
  var lastActivity = [];
  var viewerName = "";
  var pendingRemote = null;
  try { knownRevision = parseInt(localStorage.getItem(LS_REV) || "0", 10) || 0; } catch (eRev) { knownRevision = 0; }

  function markDirty() {
    dirty = true;
    pendingLocal = true;
    try { localStorage.setItem(LS_PENDING, "1"); } catch (e) {}
  }
  function clearPending() {
    dirty = false;
    pendingLocal = false;
    try { localStorage.removeItem(LS_PENDING); } catch (e) {}
  }
  function save(now) {
    applyAccent();
    if (!applyingRemote) markDirty();
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = 0; }
    if (now) flushSave();
    else saveTimer = setTimeout(flushSave, 200);
  }
  function writeLocal() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      localStorage.setItem(LS_REV, String(knownRevision));
    } catch (e) {
      if (!saveWarned) { saveWarned = true; toast("This browser blocked saving the board."); }
    }
  }
  function flushSave() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = 0; }
    writeLocal();
    if (!applyingRemote) schedulePush();
  }
  function schedulePush() {
    if (!shared || applyingRemote) return;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { pushBoard(false); }, 350);
  }
  window.addEventListener("pagehide", function () {
    writeLocal();
    if (shared && dirty && !applyingRemote) pushBoard(true);
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") {
      writeLocal();
      if (shared && dirty && !applyingRemote) pushBoard(true);
    }
  });
  function applyAccent() {
    document.documentElement.style.setProperty("--accent", safeColor(state.accent, "#6c5ce7"));
  }
  function syncDocumentTitle() {
    var name = String(state.title || "").trim() || "Untitled board";
    document.title = name + " · Flowboard";
  }

  var themeState = "system";
  try { themeState = localStorage.getItem(LS_THEME) || "system"; } catch (e2) {}
  if (themeState !== "light" && themeState !== "dark" && themeState !== "system") themeState = "system";
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
  var AUTO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/></svg>';
  function themeIsDark() {
    if (themeState === "dark") return true;
    if (themeState === "light") return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function applyTheme() {
    var root = document.documentElement;
    if (themeState === "system") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", themeState);
    var b = document.getElementById("themeBtn");
    b.innerHTML = themeState === "light" ? SUN : themeState === "dark" ? MOON : AUTO;
    var label = "Theme: " + themeState.charAt(0).toUpperCase() + themeState.slice(1) + ". Activate to switch.";
    b.title = "Theme: " + themeState.charAt(0).toUpperCase() + themeState.slice(1);
    b.setAttribute("aria-label", label);
    var meta = document.getElementById("themeColor");
    if (meta) meta.setAttribute("content", themeIsDark() ? "#12131d" : "#f5f6fb");
  }
  document.getElementById("themeBtn").addEventListener("click", function () {
    themeState = themeState === "system" ? "light" : themeState === "light" ? "dark" : "system";
    try { localStorage.setItem(LS_THEME, themeState); } catch (e) {}
    applyTheme();
    announce("Theme " + themeState);
  });
  if (window.matchMedia) {
    var scheme = window.matchMedia("(prefers-color-scheme: dark)");

    if (scheme.addEventListener) scheme.addEventListener("change", onScheme);
    else if (scheme.addListener) scheme.addListener(onScheme);
  }

  function labelById(id) {
    for (var i = 0; i < state.labels.length; i++) if (state.labels[i].id === id) return state.labels[i];
    return null;
  }
  function priorityById(id) {
    for (var i = 0; i < PRIORITIES.length; i++) if (PRIORITIES[i].id === id) return PRIORITIES[i];
    return PRIORITIES[0];
  }
  function columnById(id) {
    for (var i = 0; i < state.columns.length; i++) if (state.columns[i].id === id) return state.columns[i];

  function initials(name) {
    var p = String(name || "").trim().split(/\s+/);

  function avatarColor(name) {

  }
  function fmtDue(d) {
    if (!d) return null;
    var dt = new Date(d + "T00:00:00");
    if (isNaN(dt.getTime())) return null;
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var diff = Math.round((dt.getTime() - today.getTime()) / 86400000);
    var txt = dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    if (diff === 0) txt = "Today";
    else if (diff === 1) txt = "Tomorrow";
    else if (diff === -1) txt = "Yesterday";
    return { txt: txt, overdue: diff < 0, today: diff === 0 };
  }
  function findCard(cardId) {
    for (var i = 0; i < state.columns.length; i++) {
      var cs = state.columns[i].cards;
      for (var j = 0; j < cs.length; j++) if (cs[j].id === cardId) return { col: state.columns[i], card: cs[j], ci: i, cj: j };
    }
    return null;
  }
  function indexBoard() {
    var byId = {};
    var kids = {};
    for (var i = 0; i < state.columns.length; i++) {
      var cards = state.columns[i].cards;
      for (var j = 0; j < cards.length; j++) {
        byId[cards[j].id] = cards[j];
        if (cards[j].epic) {
          if (!kids[cards[j].epic]) kids[cards[j].epic] = [];
          kids[cards[j].epic].push(cards[j]);
        }
      }
    }
    return { byId: byId, kids: kids };
  }
  function isFiltering() { return !!(query || filters.type || filters.overdue || filters.epic); }
  function cardMatches(card) {
    if (filters.type && card.type !== filters.type) return false;
    if (filters.epic && card.id !== filters.epic && card.epic !== filters.epic) return false;
    if (filters.overdue) {
      var due = fmtDue(card.due);
      if (!due || !due.overdue) return false;
    }
    if (!query) return true;
    var hay = (card.title + " " + (card.notes || "") + " " + (card.assignee || "")).toLowerCase();
    var labels = card.labels || [];
    for (var i = 0; i < labels.length; i++) { var l = labelById(labels[i]); if (l) hay += " " + l.name.toLowerCase(); }
    hay += " " + typeById(card.type).name.toLowerCase();
    hay += " " + String(card.size || "").toLowerCase();
    var stepList = card.steps || [];
    for (var si = 0; si < stepList.length; si++) hay += " " + String(stepList[si].text || "").toLowerCase();
    hay += " " + priorityById(card.priority).name.toLowerCase();
    return hay.indexOf(query) !== -1;

  function idsOf() {
    var parts = [];
    for (var i = 0; i < state.columns.length; i++) {
      var ids = [];
      for (var j = 0; j < state.columns[i].cards.length; j++) ids.push(state.columns[i].cards[j].id);
      parts.push(state.columns[i].id + ":" + ids.join(","));
    }
    return parts.join("|");
  }
  // Hidden cards stay beside the visible card they already sat in front of,
  // so a search filter can't reshuffle the real order while you drag.
  function arrangeCards(original, card, beforeId) {
    var anchorOf = {};
    var upcoming = "";
    for (var i = original.length - 1; i >= 0; i--) {
      var cd = original[i];
      if (cd.id === card.id) { upcoming = card.id; continue; }
      if (cardMatches(cd)) upcoming = cd.id;
      else anchorOf[cd.id] = upcoming;
    }
    var groups = {};
    var visible = [];
    for (var j = 0; j < original.length; j++) {
      var item = original[j];
      if (item.id === card.id) continue;
      if (cardMatches(item)) { visible.push(item); continue; }

      }
      pushGroup(visible[v].id, next);
      next.push(visible[v]);

  function moveCardBefore(cardId, colId, beforeId) {

  function typingTarget(el) {

  function announce(msg) {

  var board = document.getElementById("board");

  function render() {

    var left = scroller.scrollLeft;
    var top = scroller.scrollTop;
    var tops = {};
    var lists = board.querySelectorAll(".cards");
    for (var s = 0; s < lists.length; s++) tops[lists[s].dataset.col] = lists[s].scrollTop;
    var index = indexBoard();
    board.innerHTML = "";
    var total = 0;
    var shown = 0;
    for (var i = 0; i < state.columns.length; i++) {
      total += state.columns[i].cards.length;
      var matches = [];
      for (var j = 0; j < state.columns[i].cards.length; j++) if (cardMatches(state.columns[i].cards[j])) matches.push(state.columns[i].cards[j]);
      shown += matches.length;
      board.appendChild(renderColumn(state.columns[i], matches, index));
    }
    var add = button("add-col");
    add.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Add group';
    add.addEventListener("click", addColumn);
    board.appendChild(add);

    scroller.scrollTop = top;
    var nextLists = board.querySelectorAll(".cards");

  function syncStats(total, shown) {

  function syncBanner(total, shown) {

    banner.hidden = false;
    banner.innerHTML = "";

    text.textContent = query ? "No cards match “" + query + "”." : "No cards match these filters.";
    var clear = button("btn");

  function syncFilterUi() {

  function renderColumn(col, matches, index) {

  function renderCard(card, index) {
    var el = document.createElement("article");
    el.className = "card";
    el.dataset.id = card.id;
    el.tabIndex = 0;
    var titleText = String(card.title || "").trim();
    el.setAttribute("aria-label", (titleText || "Untitled") + ", " + typeById(card.type).name);

    if (card.epic && index.byId[card.epic] && index.byId[card.epic].type === "epic") {
      var ep = index.byId[card.epic];
      var ec = button("epic-chip");
      ec.title = "Show cards in " + ep.title;
      ec.innerHTML = typeIcon("epic", 12);
      var et = document.createElement("span");
      et.textContent = ep.title;
      ec.appendChild(et);
      ec.addEventListener("click", function (e) {
        e.stopPropagation();
        filters.epic = ep.id;
        syncFilterUi();
        render();
      });
      el.appendChild(ec);
    }

    var meta = document.createElement("div");
    meta.className = "card-labels";
    var ty = typeById(card.type);
    var tc = document.createElement("span");
    tc.className = "type-chip";
    tc.style.color = ty.color;
    tc.innerHTML = typeIcon(ty.id, 12);
    var tn = document.createElement("span");
    tn.textContent = ty.name;
    tc.appendChild(tn);
    meta.appendChild(tc);
    var labs = card.labels || [];
    for (var i = 0; i < labs.length; i++) {
      var lab = labelById(labs[i]);
      if (!lab) continue;
      var chip = document.createElement("span");
      chip.className = "chip";
      chip.style.background = safeColor(lab.color, "#7e8299");

    var title = document.createElement("div");
    title.className = "card-title" + (titleText ? "" : " is-untitled");
    title.textContent = titleText ? card.title : "Untitled";
    el.appendChild(title);

    if (card.type === "epic") {
      var kids = index.kids[card.id] || [];
      if (kids.length) {
        var points = 0;
        var overdue = 0;
        for (var k = 0; k < kids.length; k++) {
          points += cardPoints(kids[k]);
          var kd = fmtDue(kids[k].due);
          if (kd && kd.overdue) overdue++;
        }
        var roll = button("rollup" + (overdue ? " warn" : ""));
        var bits = [kids.length + " linked"];
        if (points) bits.push(points + " pts");
        if (overdue) bits.push(overdue + " overdue");

      pts.className = "size-badge";
      pts.style.setProperty("--sz", doneSteps === writtenSteps.length ? "#00c875" : "#6c5ce7");

      sz.title = "Estimate: " + card.size;

      d.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';

  function moveCardBy(cardId, dx, dy) {
    var found = findCard(cardId);
    if (!found) return;
    if (dy) {
      var vis = found.col.cards.filter(cardMatches);
      var i = -1;
      for (var k = 0; k < vis.length; k++) if (vis[k].id === cardId) i = k;
      var j = i + dy;
      if (i < 0 || j < 0 || j >= vis.length) return;
      var beforeId = dy > 0 ? (vis[j + 1] ? vis[j + 1].id : null) : vis[j].id;
      if (!moveCardBefore(cardId, found.col.id, beforeId)) return;
      render();
      focusCard(cardId, true);
      announce("Moved " + (found.card.title || "item") + " in " + found.col.name);
      return;
    }
    var destIndex = found.ci + dx;
    if (destIndex < 0 || destIndex >= state.columns.length) return;
    var dest = state.columns[destIndex];
    var visFrom = found.col.cards.filter(cardMatches);
    var at = 0;
    for (var a = 0; a < visFrom.length; a++) if (visFrom[a].id === cardId) at = a;
    var destVis = dest.cards.filter(cardMatches);
    var anchor = destVis[at] ? destVis[at].id : null;
    if (!moveCardBefore(cardId, dest.id, anchor)) return;
    render();
    focusCard(cardId, true);
    var now = findCard(cardId);
    if (now) announce("Moved " + (now.card.title || "item") + " to " + now.col.name);
  }
  function focusCard(id, scroll) {
    var el = board.querySelector('.card[data-id="' + id + '"]');
    if (!el) return;
    try { el.focus({ preventScroll: true }); } catch (err) { el.focus(); }
    if (scroll && el.scrollIntoView) {
      el.scrollIntoView({ block: "nearest", inline: "nearest", behavior: reduceMotion() ? "auto" : "smooth" });
    }
  }

  function bindPress(el, onStart) {

        clientX: x,
        clientY: y,
        target: target,
        preventDefault: function () { try { if (src.cancelable) src.preventDefault(); } catch (err) {} },
        listen: function (onMove, onEnd) {

          }

            if (!p) return;
            onMove(p, ev);
          }
          function end(ev) {

            cleanup();
            onEnd(p || { x: x, y: y, type: "cancel" });

            if (ended) return;
            ended = true;
            document.removeEventListener(moveEvent, move);
            document.removeEventListener(upEvent, end);
            if (cancelEvent) document.removeEventListener(cancelEvent, end);
          }
          var moveEvent = kind === "pointer" ? "pointermove" : kind === "touch" ? "touchmove" : "mousemove";
          var upEvent = kind === "pointer" ? "pointerup" : kind === "touch" ? "touchend" : "mouseup";

          document.addEventListener(moveEvent, move, { passive: false });
          document.addEventListener(upEvent, end);

    });

      var t = e.changedTouches && e.changedTouches[0];

      session("touch", t.identifier, "touch", 0, t.clientX, t.clientY, e.target, e);
    }, { passive: false });
  }

  function wireCardDrag(el) {
    bindPress(el, function (press) {
      if (pressLock || press.button) return;
      var fromHandle = !!closest(press.target, ".drag-handle");
      var touch = press.pointerType === "touch";
      if (touch && !fromHandle) return;
      if (!fromHandle && closest(press.target, "button, a, input, textarea, select")) return;
      if (fromHandle) press.preventDefault();
      var startX = press.clientX;
      var startY = press.clientY;
      var id = el.dataset.id;
      pressLock = true;
      press.listen(function (p, ev) {
        if (!drag) {

    for (var i = 0; i < state.columns.length; i++) {
      var col = state.columns[i];

      var count = 0;
      var points = 0;
      var late = 0;
      for (var j = 0; j < col.cards.length; j++) {
        var card = col.cards[j];
        var pts = cardPoints(card);

        points += pts;

        else openPoints += pts;
        var due = fmtDue(card.due);
        if (due && due.overdue) { overdue += 1; late += 1; }

        if (!String(card.assignee || "").trim()) unassigned += 1;
        byType[card.type] = (byType[card.type] || 0) + 1;
        byPriority[card.priority] = (byPriority[card.priority] || 0) + 1;
        var who = String(card.assignee || "").trim();

      total: total, overdue: overdue, dueToday: dueToday, unassigned: unassigned,
      openPoints: openPoints, donePoints: donePoints, byType: byType, byPriority: byPriority,
      columns: columns, people: people

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function clearView(opts) {
    query = "";
    filters.type = "";
    filters.overdue = false;
    filters.epic = "";
    var s = document.getElementById("search");
    s.value = "";
    document.getElementById("searchClear").hidden = true;
    syncFilterUi();
    render();
    if (opts && opts.blur) s.blur();
  }
  document.getElementById("filters").addEventListener("click", function (e) {
    var b = closest(e.target, "[data-filter]");
    if (!b) return;
    var kind = b.dataset.filter;
    if (kind === "type") filters.type = b.dataset.value || "";
    else if (kind === "overdue") filters.overdue = !filters.overdue;
    else if (kind === "epic") filters.epic = "";
    else if (kind === "clear") { filters.type = ""; filters.overdue = false; filters.epic = ""; }
    syncFilterUi();
    render();
  });

  var titleInput = document.getElementById("boardTitle");
  titleInput.value = state.title;
  titleInput.addEventListener("input", function () { state.title = titleInput.value; syncDocumentTitle(); save(); });
  titleInput.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); titleInput.blur(); } });
  titleInput.addEventListener("blur", function () {
    var v = titleInput.value.trim() || "Untitled board";
    titleInput.value = v;
    if (v === state.title) return;
    state.title = v;
    syncDocumentTitle();
    save(true);
  });

  var searchInput = document.getElementById("search");
  var searchClear = document.getElementById("searchClear");
  searchInput.addEventListener("input", function () {
    query = searchInput.value.trim().toLowerCase();
    searchClear.hidden = !searchInput.value;
    renderSoon();
  });
  searchInput.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); clearView({ blur: true }); }
  });
  searchClear.addEventListener("click", function () { clearView(); searchInput.focus(); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (drag) { e.preventDefault(); finishDrag(true); return; }
      if (openMenuEl) { closeMenu(); return; }
      if (panel) { closePanel(); return; }
      if (typingTarget(document.activeElement)) { document.activeElement.blur(); return; }
      if (isFiltering()) { clearView({ blur: true }); return; }
      return;
    }
    if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey && !typingTarget(document.activeElement)) {
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
      return;
    }
    if ((e.key === "n" || e.key === "N") && !e.metaKey && !e.ctrlKey && !e.altKey && !typingTarget(document.activeElement) && !panel) {
      e.preventDefault();
      var sel = ".col .add-item";
      var active = document.activeElement;
      if (active && active.dataset && active.dataset.id) {
        var found = findCard(active.dataset.id);
        if (found) sel = '.col[data-col="' + found.col.id + '"] .add-item';
      }
      var add = board.querySelector(sel) || board.querySelector(".col .add-item");
      if (add) add.click();
    }
  });

  function cardCount(board) {
    var n = 0;
    var cols = board && board.columns ? board.columns : [];
    for (var i = 0; i < cols.length; i++) n += (cols[i].cards || []).length;
    return n;
  }
  function canon(value) {
    if (Array.isArray(value)) {
      var items = [];
      for (var i = 0; i < value.length; i++) items.push(canon(value[i]));
      return "[" + items.join(",") + "]";
    }
    if (value && typeof value === "object") {
      var keys = Object.keys(value).sort();
      var parts = [];
      for (var k = 0; k < keys.length; k++) parts.push(JSON.stringify(keys[k]) + ":" + canon(value[keys[k]]));
      return "{" + parts.join(",") + "}";
    }
    return JSON.stringify(value);
  }
  function sameBoard(a, b) {
    var left = normalize(a);
    var right = normalize(b);
    return !!(left && right && canon(left) === canon(right));
  }
  function setSyncNote(data) {
    var note = document.getElementById("syncNote");
    if (!note) return;
    if (!shared) { note.textContent = "This browser"; note.title = "Saved in this browser only"; return; }
    var who = data && data.updatedBy ? data.updatedBy : "";
    note.textContent = who ? "Shared · " + who : "Shared";
    note.title = who ? "Last change by " + who : "Shared with everyone who can open this board";
  }
  function hideRemoteBanner() {
    var banner = document.getElementById("remoteBanner");
    if (banner) { banner.hidden = true; banner.innerHTML = ""; }
  }
  function showRemoteBanner(data) {
    var banner = document.getElementById("remoteBanner");
    if (!banner) return;
    banner.hidden = false;
    banner.innerHTML = "";
    var text = document.createElement("span");
    var who = data.updatedBy || "Someone";
    text.textContent = who + " changed the board. Load that version, or keep yours and share it.";
    var actions = document.createElement("div");
    actions.className = "actions";
    var keep = button("btn");
    keep.textContent = "Keep mine";
    keep.addEventListener("click", function () {
      serverRevision = data.revision || serverRevision;
      pendingRemote = null;
      hideRemoteBanner();
      pushBoard(false);
    });
    var load = button("btn btn-primary");
    load.textContent = "Load theirs";
    load.addEventListener("click", function () { applyRemote(data, false); });
    actions.appendChild(keep);
    actions.appendChild(load);
    banner.appendChild(text);
    banner.appendChild(actions);
  }
  function applyRemote(data, announceIt) {
    var next = normalize(data.board);
    if (!next) return;
    applyingRemote = true;
    state = next;
    serverRevision = data.revision || 0;
    knownRevision = serverRevision;
    clearPending();
    pendingRemote = null;
    if (data.activity) lastActivity = data.activity;
    writeLocal();
    var titleInput = document.getElementById("boardTitle");
    if (titleInput && document.activeElement !== titleInput) titleInput.value = state.title;
    hideRemoteBanner();
    render();
    syncDocumentTitle();
    setSyncNote(data);
    applyingRemote = false;
    if (announceIt && data.updatedBy) {
      var summary = data.activity && data.activity[0] ? data.activity[0].summary : "updated the board";
      toast(data.updatedBy + " " + summary);
    }
  }
  function pushBoard(keepalive) {
    if (!shared || applyingRemote) return;
    var revision = serverRevision;
    var payload = JSON.stringify({ board: state, baseRevision: revision });
    fetch("/api/board", {
      method: "PUT",
      headers: { "content-type": "application/json", accept: "application/json" },
      body: payload,
      keepalive: !!keepalive
    }).then(function (res) {
      return res.json().then(function (body) { return { status: res.status, body: body }; }, function () { return { status: res.status, body: null }; });
    }).then(function (result) {
      if (!result.body) return;
      if (result.status === 409 && result.body.board) {
        if (sameBoard(state, result.body.board)) {
          adopt(result.body);
          return;
        }
        pendingRemote = result.body;
        showRemoteBanner(result.body);
        return;
      }
      if (result.status >= 200 && result.status < 300) {
        serverRevision = result.body.revision || serverRevision;
        knownRevision = serverRevision;
        clearPending();
        if (result.body.activity) lastActivity = result.body.activity;
        writeLocal();
        setSyncNote(result.body);
      }
    }).catch(function () {});
  }
  function editingNow() {
    return !!(panel || typingTarget(document.activeElement));
  }
  function pullBoard() {
    return fetch("/api/board", { headers: { accept: "application/json" }, cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("offline");
      return res.json();
    }).then(function (data) {
      shared = true;
      viewerName = data.viewerName || "";
      if (data.activity) lastActivity = data.activity;
      if (pendingRemote && data.revision === pendingRemote.revision) {
        setSyncNote(data);
        return;
      }
      if (!data.board || !data.revision) {
        serverRevision = 0;
        if (pendingLocal || dirty || (storedRaw && cardCount(state))) schedulePush();
        setSyncNote(data);
        return;
      }
      if (sameBoard(state, data.board)) {
        adopt(data);
        return;
      }
      if ((pendingLocal || dirty) && data.revision === knownRevision) {
        serverRevision = data.revision;
        schedulePush();
        setSyncNote(data);
        return;
      }
      var firstLoad = !serverRevision;
      if (firstLoad && (pendingLocal || dirty)) {
        pendingRemote = data;
        showRemoteBanner(data);
        setSyncNote(data);
        return;
      }
      if (firstLoad && knownRevision === 0 && storedRaw && cardCount(state) && cardCount(data.board)) {
        pendingRemote = data;
        showRemoteBanner(data);
        setSyncNote(data);
        return;
      }
      if (firstLoad && (!storedRaw || !cardCount(state))) {
        applyRemote(data, false);
        return;
      }
      if (data.revision === serverRevision || (data.revision === knownRevision && !dirty && !pendingLocal)) {
        serverRevision = data.revision;
        knownRevision = data.revision;
        writeLocal();
        setSyncNote(data);
        return;
      }
      if (data.revision !== serverRevision) {
        if (dirty || pendingLocal || editingNow()) {
          pendingRemote = data;
          showRemoteBanner(data);
        } else applyRemote(data, serverRevision > 0);
      }
    }).catch(function () {
      shared = false;
      setSyncNote(null);
    });
  }
  function adopt(data) {
    serverRevision = data.revision || 0;
    knownRevision = serverRevision;
    clearPending();
    pendingRemote = null;
    if (data.activity) lastActivity = data.activity;
    hideRemoteBanner();
    writeLocal();
    setSyncNote(data);
  }
  function openChanges() {
    triggerEl = document.getElementById("changesBtn");
    returnCardId = null;
    openScrim();
    panel = document.createElement("aside");
    panel.className = "panel";
    panel.setAttribute("role", "dialog");
    panel.setAttribute("aria-modal", "true");
    panel.setAttribute("aria-label", "Changes");
    var head = document.createElement("div");
    head.className = "panel-head";
    head.innerHTML = "<h2>Changes</h2>";
    var close = button("btn btn-icon");
    close.setAttribute("aria-label", "Close");
    close.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
    close.addEventListener("click", function () { closePanel(); });
    head.appendChild(close);
    panel.appendChild(head);
    var body = document.createElement("div");
    body.className = "panel-body";
    var intro = document.createElement("p");
    intro.className = "hint";
    if (!shared) intro.textContent = "This copy stays in this browser. The shared board keeps everyone’s changes when this page is opened from the published app.";
    else intro.textContent = (viewerName ? "You are " + viewerName + ". " : "") + "Everyone who can open this board sees the same items. New changes show up here.";
    body.appendChild(intro);
    if (!lastActivity.length) {
      var empty = document.createElement("p");
      empty.className = "hint";
      empty.textContent = shared ? "No shared changes yet." : "Nothing shared yet.";
      body.appendChild(empty);
    }
    for (var i = 0; i < lastActivity.length; i++) {
      var item = document.createElement("div");
      item.className = "activity-item";
      var strong = document.createElement("strong");
      strong.textContent = (lastActivity[i].actorName || "Someone") + " " + (lastActivity[i].summary || "edited the board");
      var when = document.createElement("span");
      var at = lastActivity[i].createdAt ? new Date(lastActivity[i].createdAt) : null;
      when.textContent = at && !isNaN(at.getTime()) ? at.toLocaleString() : "";
      item.appendChild(strong);
      item.appendChild(when);
      body.appendChild(item);
    }
    panel.appendChild(body);
    trapFocus(panel);
    document.body.appendChild(panel);
    close.focus();
  }
  document.getElementById("changesBtn").addEventListener("click", openChanges);

  applyTheme();
  applyAccent();
  syncDocumentTitle();
  render();
  if (storedRaw && JSON.stringify(state) !== storedRaw) writeLocal();
  if (!/[?&]selftest=1/.test(location.search)) {
    pullBoard().then(function () {
      if (pullTimer) clearInterval(pullTimer);
      if (shared) pullTimer = setInterval(function () { pullBoard(); }, 4000);
    });
  }

  if (/[?&]selftest=1/.test(location.search)) {
    var report = [];
    function expect(name, got, exp) {
      var ok = JSON.stringify(got) === JSON.stringify(exp);
      report.push((ok ? "ok" : "FAIL") + " " + name + (ok ? "" : " got " + JSON.stringify(got)));
    }
    function ids(list) { return list.map(function (c) { return c.id; }); }
    function card(id, title) {
      return { id: id, title: title || id, notes: "", type: "task", size: "", epic: "", priority: "none", assignee: "", due: "", labels: [] };
    }
    var q = query;
    var f = { type: filters.type, overdue: filters.overdue, epic: filters.epic };
    query = "";
    filters = { type: "", overdue: false, epic: "" };
    var A = card("A"), B = card("B"), C = card("C");
    expect("move down", ids(arrangeCards([A, B, C], A, "C")), ["B", "A", "C"]);
    expect("move up", ids(arrangeCards([A, B, C], C, "B")), ["A", "C", "B"]);
    expect("drop in place", ids(arrangeCards([A, B, C], A, "B")), ["A", "B", "C"]);
    query = "vis";
    var V1 = card("V1", "vis one"), H1 = card("H1", "secret"), V2 = card("V2", "vis two");
    expect("hidden stays in front", ids(arrangeCards([H1, V1], V1, null)), ["H1", "V1"]);
    expect("trailing hidden stays last", ids(arrangeCards([V1, H1], V2, null)), ["V1", "V2", "H1"]);
    expect("hidden follows its card", ids(arrangeCards([V1, H1, V2], V2, "V1")), ["H1", "V2", "V1"]);
    query = q;
    filters = f;
    expect("reject bad day", validDate("2026-02-31"), false);
    expect("accept real day", validDate("2026-11-22"), true);
    var cleaned = normalize({
      title: "X",
      accent: "red;background:url(//evil)",
      labels: [{ id: "L", name: "Lab", color: "expression(alert(1))" }],
      columns: [{ id: "col", name: "G", color: "#112233", cards: [{ id: "1", title: "T", type: "nope", labels: ["nope"] }] }]
    });
    expect("accent sanitized", cleaned.accent, "#6c5ce7");
    expect("label color sanitized", cleaned.labels[0].color, "#7e8299");
    expect("type sanitized", cleaned.columns[0].cards[0].type, "task");
    expect("unknown label dropped", cleaned.columns[0].cards[0].labels, []);
    var renamed = normalize({
      title: "Product Sprint",
      columns: [{ id: "c", name: "Backlog", cards: [
        { id: "1", title: "Onboarding revamp" },
        { id: "2", title: "Reply to Maya" }
      ]}]
    });
    expect("placeholder dropped", dropPlaceholder(renamed), true);
    expect("board renamed", renamed.title, "Email & Contact Board");
    expect("real card kept", renamed.columns[0].cards.map(function (c) { return c.title; }), ["Reply to Maya"]);
    var withSteps = normalize({
      title: "X",
      columns: [{ id: "c", name: "G", cards: [{ id: "1", title: "T", steps: [
        { text: "Write the intro", done: true },
        { text: "   ", done: true },
        { text: "Send it", done: false }
      ] }] }]
    });
    expect("story points kept", withSteps.columns[0].cards[0].steps, [
      { text: "Write the intro", done: true },
      { text: "Send it", done: false }
    ]);
    var failed = report.some(function (line) { return line.indexOf("FAIL") === 0; });
    document.documentElement.setAttribute("data-selftest", failed ? "fail" : "pass");
    document.documentElement.setAttribute("data-selftest-detail", report.join(" | "));
  }
})();
</script>
</body>
</html>
